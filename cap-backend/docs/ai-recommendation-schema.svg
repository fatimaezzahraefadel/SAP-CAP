<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="1200" height="675" fill="#F7FAFA"/>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-size="38" font-weight="700" fill="#0F2E2C">Recommandation IA d'affectation</text>
  <text x="600" y="120" text-anchor="middle" font-size="20" fill="#5B6B6A">Le ticket est analysé par l'IA, qui recommande le meilleur consultant</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0FA6A0"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0FA6A0" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- STEP 1: Ticket -->
  <g filter="url(#shadow)">
    <rect x="70" y="270" width="240" height="180" rx="18" fill="#FFFFFF" stroke="#E2E8E8" stroke-width="2"/>
  </g>
  <text x="190" y="345" text-anchor="middle" font-size="64">🎫</text>
  <text x="190" y="400" text-anchor="middle" font-size="24" font-weight="700" fill="#0F2E2C">Ticket</text>
  <text x="190" y="428" text-anchor="middle" font-size="15" fill="#5B6B6A">à affecter</text>

  <!-- Arrow 1 -->
  <line x1="320" y1="360" x2="430" y2="360" stroke="#0FA6A0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 2: IA -->
  <g filter="url(#shadow)">
    <rect x="445" y="230" width="310" height="260" rx="18" fill="#0FA6A0"/>
  </g>
  <text x="600" y="300" text-anchor="middle" font-size="52">🤖</text>
  <text x="600" y="338" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">L'IA compare</text>
  <text x="600" y="362" text-anchor="middle" font-size="15" fill="#D6F2F0">les consultants selon 4 critères</text>

  <!-- 4 criteria chips -->
  <g font-size="14" fill="#0F2E2C">
    <rect x="470" y="388" width="120" height="34" rx="17" fill="#FFFFFF"/>
    <text x="530" y="410" text-anchor="middle">Compétences</text>
    <rect x="610" y="388" width="120" height="34" rx="17" fill="#FFFFFF"/>
    <text x="670" y="410" text-anchor="middle">Disponibilité</text>
    <rect x="470" y="430" width="120" height="34" rx="17" fill="#FFFFFF"/>
    <text x="530" y="452" text-anchor="middle">Expérience</text>
    <rect x="610" y="430" width="120" height="34" rx="17" fill="#FFFFFF"/>
    <text x="670" y="452" text-anchor="middle">Performance</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="765" y1="360" x2="875" y2="360" stroke="#0FA6A0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- STEP 3: Recommended consultant -->
  <g filter="url(#shadow)">
    <rect x="890" y="270" width="240" height="180" rx="18" fill="#FFFFFF" stroke="#0FA6A0" stroke-width="2.5"/>
  </g>
  <text x="1010" y="345" text-anchor="middle" font-size="60">⭐</text>
  <text x="1010" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#0F2E2C">Consultant</text>
  <text x="1010" y="428" text-anchor="middle" font-size="16" fill="#0FA6A0" font-weight="600">recommandé</text>

  <!-- Footer -->
  <text x="600" y="600" text-anchor="middle" font-size="16" fill="#8A9897">Ticket  →  Analyse IA des 4 critères  →  Meilleur profil recommandé</text>
</svg>
