<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inetum Performance Hub — SAP project, ticket and consultant performance management." />
    <meta name="theme-color" content="#1f4e79" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>Inetum Performance Hub</title>
    <style>
      /* First-paint splash shown until the React bundle mounts. */
      #root:empty {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
      }
      #root:empty::after {
        content: '';
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid #cbd5e1;
        border-top-color: #1f4e79;
        animation: root-spin 0.8s linear infinite;
      }
      @keyframes root-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #root:empty { background: #0f172a; }
        #root:empty::after { border-color: #334155; border-top-color: #60a5fa; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
