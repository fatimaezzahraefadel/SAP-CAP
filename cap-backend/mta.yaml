_schema-version: "3.3"
ID: pfa-gcc-cap
description: PFA-GCC-CAP — Plateforme de gestion des congés et certificats Inetum
version: 1.0.0

parameters:
  enable-parallel-deployments: true
  deploy_mode: dist

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm ci --prefix app/frontend
        - npm run build

modules:
  - name: pfa-gcc-cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
      stack: cflinuxfs4
    properties:
      NODE_ENV: production
    build-parameters:
      builder: npm-ci
      ignore:
        - "node_modules/"
        - "default-env.json"
        - ".env"
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: pfa-gcc-cap-db
      - name: pfa-gcc-cap-uaa

  - name: pfa-gcc-cap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
      no-route: true
      no-start: false
      health-check-type: process
    build-parameters:
      ignore:
        - "node_modules/"
    requires:
      - name: pfa-gcc-cap-db

  - name: pfa-gcc-cap-approuter
    type: approuter.nodejs
    path: app/approuter
    parameters:
      keep-existing-routes: true
      disk-quota: 512M
      memory: 256M
      stack: cflinuxfs4
    properties:
      NODE_ENV: production
    build-parameters:
      ignore:
        - "node_modules/"
        - "default-env.json"
        - "README.md"
        - ".gitkeep"
        - "**/.gitkeep"
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          strictSSL: true
          timeout: 60000
      - name: pfa-gcc-cap-uaa

resources:
  - name: pfa-gcc-cap-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: pfa-gcc-cap-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: pfa-gcc-cap-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.cfapps.us10.hana.ondemand.com/**
            - https://*.cfapps.us10-001.hana.ondemand.com/**
