_schema-version: "3.3"
ID: ticket-cap
description: Ticket-CAP performance dashboard - CAP backend, Approuter, and SPA
version: 1.0.0

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm ci --prefix app/frontend
        - npm run build

modules:
  # 1. CAP backend
  - name: ticket-cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: ticket-cap-db
      - name: ticket-cap-uaa

  # 2. HANA HDI deployer
  - name: ticket-cap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: ticket-cap-db

  # 3. Approuter
  - name: ticket-cap-approuter
    type: approuter.nodejs
    path: app/approuter
    parameters:
      keep-existing-routes: true
      disk-quota: 512M
      memory: 256M
    build-parameters:
      ignore: ["node_modules/"]
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: ticket-cap-uaa

resources:
  # Runtime database container
  - name: ticket-cap-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # OAuth and authorization service
  - name: ticket-cap-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: ticket-cap-${space}
        tenant-mode: dedicated
