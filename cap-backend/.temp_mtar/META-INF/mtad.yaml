_schema-version: "3.3"
ID: ticket-cap
description: Ticket-CAP performance dashboard — CAP backend, Approuter, and SPA
version: 1.0.0
modules:
- name: ticket-cap-srv
  type: javascript.nodejs
  path: ticket-cap-srv
  requires:
  - name: ticket-cap-db
  - name: ticket-cap-uaa
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    disk-quota: 1024M
    memory: 512M
    stack: cflinuxfs4
- name: ticket-cap-db-deployer
  type: com.sap.xs.hdi
  path: ticket-cap-db-deployer
  requires:
  - name: ticket-cap-db
  parameters:
    buildpack: nodejs_buildpack
    disk-quota: 512M
    health-check-type: process
    memory: 256M
    no-route: true
    no-start: false
- name: ticket-cap-approuter
  type: javascript.nodejs
  path: ticket-cap-approuter
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      strictSSL: true
      timeout: 60000
      url: ~{srv-url}
  - name: ticket-cap-uaa
  parameters:
    disk-quota: 512M
    keep-existing-routes: true
    memory: 256M
    stack: cflinuxfs4
resources:
- name: ticket-cap-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: ticket-cap-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        redirect-uris:
        - https://*.cfapps.eu10.hana.ondemand.com/**
        - https://*.cfapps.us10.hana.ondemand.com/**
        - https://*.cfapps.us10-001.hana.ondemand.com/**
      tenant-mode: dedicated
      xsappname: ticket-cap-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
parameters:
  deploy_mode: dist
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci --omit=dev=false
    - npm ci --prefix app/frontend
    - npm run build
